let deviceTab='list',deviceSearch='',deviceEditId=null;let records=[],page='আজকের হাজিরা',busy=false;const pages=['আজকের হাজিরা','কর্মী','ছুটি','মাসিক রিপোর্ট','ডিভাইস','সেটিংস'];const el=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date(Date.now()+6*3600000).toISOString().slice(0,10);const nowTime=()=>new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dhaka',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());const list=k=>records.filter(r=>r.kind===k);const employees=()=>list('employee');const settings=()=>list('settings')[0]||{start:'08:30',end:'21:00',grace:5,off:5};const mins=t=>Number(t.slice(0,2))*60+Number(t.slice(3));const name=id=>employees().find(e=>e.id===id)?.name||'অজানা';let selectedDate=today(),month=today().slice(0,7);function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),3500)}async function load(render=true){if(!db||!auth.currentUser)throw Error('আগে লগইন করুন');const snap=await get(ref(db,'attendance/records'));records=Object.entries(snap.val()||{}).map(([id,v])=>({id,...v}));if(render)draw()}
async function save(kind,data,id){if(!auth.currentUser)throw Error('লগইন প্রয়োজন');if(kind==='employee'){if(!data.employeeId||!data.name||!data.code||!data.employeeNumber||!data.personalNumber||!data.branch)throw Error('কর্মীর সব তথ্য দিন');if(employees().some(e=>e.id!==id&&(e.employeeId===data.employeeId||e.code===data.code)))throw Error('Employee ID বা Device User ID ইতিমধ্যে আছে')}
if(kind==='device'){if(!data.name||!data.shortName||!data.model||!data.location)throw Error('Device Name, Short Name, Model ও Location দিন');if(data.accessType==='Device'&&(!data.address||!Number.isInteger(Number(data.port))||Number(data.port)<1||Number(data.port)>65535))throw Error('ডিভাইস IP ও সঠিক Port দিন');if(data.accessType==='ADMS'&&!data.serial)throw Error('ADMS-এর Serial Number দিন');data.active=String(data.active)==='true';data.port=Number(data.port)||4370;if(data.serial&&list('device').some(d=>d.id!==id&&d.serial===data.serial))throw Error('এই Serial Number ইতিমধ্যে আছে')}
if(kind==='pushjob'){const e=employees().find(e=>e.id===data.employee),d=list('device').find(d=>d.id===data.device);if(!e||!d)throw Error('কর্মী ও ডিভাইস নির্বাচন করুন');if(d.active===false)throw Error('ডিভাইস Inactive আছে');if(d.accessType==='ADMS')throw Error('ADMS Receiver যুক্ত করার পর User Push চালু হবে');data={employee:e.id,device:d.id,code:e.code,name:e.name,status:'Queued',created:new Date().toISOString()}}

function options(){return employees().map(e=>'<option value="'+esc(e.id)+'">'+esc(e.name)+' · '+esc(e.code)+'</option>').join('')}
function row(e,date){const s=settings(),ps=list('punch').filter(p=>p.employee===e.id&&p.date===date).sort((a,b)=>a.time.localeCompare(b.time));const off=new Date(date+'T12:00:00+06:00').getUTCDay()===Number(s.off);const leave=list('leave').some(l=>l.employee===e.id&&l.status==='Approved'&&l.from<=date&&l.to>=date);const done=date<today()||(date===today()&&nowTime()>=s.end);let status=ps.length?'উপস্থিত':leave?'ছুটি':off?'সাপ্তাহিক বন্ধ':date<e.join?'যোগদানের আগে':done?'অনুপস্থিত':'অপেক্ষায়';const late=ps.length&&mins(ps[0].time)>mins(s.start)+Number(s.grace)?mins(ps[0].time)-mins(s.start):0;return {name:e.name,code:e.code,date,first:ps[0]?.time||'—',last:ps.length>1?ps.at(-1).time:'—',status,late};}
const tag=(text,type='')=>'<span class="tag '+type+'">'+esc(text)+'</span>';function table(headers,rows){return rows.length?'<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<div class="empty">এখনো কোনো তথ্য নেই</div>'}function attendanceTable(rows){return table(['কর্মী / User ID','প্রথম হাজিরা','শেষ হাজিরা','অবস্থা','দেরি'],rows.map(r=>['<strong>'+esc(r.name)+'</strong><br><small>'+esc(r.code)+'</small>',r.first,r.last,tag(r.status,r.status==='অনুপস্থিত'?'bad':r.status==='অপেক্ষায়'?'warn':''),r.late?tag(r.late+' মিনিট','warn'):'—']))}const field=(label,name,type='text',value='',required=true)=>'<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(required?'required':'')+'></label>';const form=(kind,contents,label='সংরক্ষণ')=>'<form data-kind="'+kind+'">'+contents+'<button>'+label+'</button></form>';
function draw(){el('clock').textContent=today()+' · বাংলাদেশ সময়';el('nav').innerHTML=pages.map(p=>'<button class="'+(page===p?'active':'')+'" data-page="'+p+'">'+p+'</button>').join('');let content='';if(page===pages[0]){const rows=employees().map(e=>row(e,selectedDate));const cards=[['মোট কর্মী',rows.length],['উপস্থিত',rows.filter(r=>r.status==='উপস্থিত').length],['দেরি',rows.filter(r=>r.late).length],['অনুপস্থিত',rows.filter(r=>r.status==='অনুপস্থিত').length]];content='<div class="title"><h1>আজকের হাজিরা</h1><div class="toolbar"><input aria-label="হাজিরার তারিখ" id="date" type="date" value="'+selectedDate+'"><button class="secondary" id="refresh">রিফ্রেশ</button></div></div><div class="cards">'+cards.map(c=>'<div class="card"><span class="muted">'+c[0]+'</span><b>'+c[1]+'</b></div>').join('')+'</div><div class="panel"><h2>হাজিরার তালিকা</h2>'+attendanceTable(rows)+'</div><div class="panel"><h2>হাজিরা যোগ করুন</h2>'+form('punch','<label>কর্মী<select name="employee" required>'+options()+'</select></label>'+field('তারিখ','date','date',selectedDate)+field('সময়','time','time',nowTime()),'হাজিরা সংরক্ষণ')+'<div class="note">৮:৩৫ পর্যন্ত দেরি মাফ। দিনের শেষ সময়ের আগে হাজিরা না থাকলে “অপেক্ষায়” দেখাবে। একাধিক হাজিরার প্রথম ও শেষ সময় রিপোর্টে দেখাবে।</div></div>'}

if(page===pages[2])content='<div class="title"><h1>ছুটির হিসাব</h1></div><div class="panel"><h2>ছুটির আবেদন</h2>'+form('leave','<label>কর্মী<select name="employee" required>'+options()+'</select></label>'+field('শুরু','from','date',today())+field('শেষ','to','date',today())+field('কারণ','reason'))+'</div><div class="panel">'+table(['কর্মী','শুরু','শেষ','কারণ','অবস্থা','অনুমোদন'],list('leave').map(l=>[esc(name(l.employee)),l.from,l.to,esc(l.reason),tag(l.status,l.status==='Pending'?'warn':l.status==='Rejected'?'bad':''),l.status==='Pending'?'<button data-leave="'+l.id+'" data-status="Approved">অনুমোদন</button> <button class="secondary" data-leave="'+l.id+'" data-status="Rejected">বাতিল</button>':'—']))+'</div>';
if(page===pages[3]){const rows=reportRows();content='<div class="title"><h1>মাসিক রিপোর্ট</h1><div class="toolbar"><input aria-label="রিপোর্টের মাস" id="month" type="month" value="'+month+'"><button id="export">Excel CSV</button><button class="secondary" id="print">PDF / প্রিন্ট</button></div></div><div class="panel">'+table(['কর্মী','কর্মদিবস','উপস্থিত','দেরির দিন','দেরি (মিনিট)','অনুপস্থিত','ছুটি'],rows.map(r=>[esc(r.name),r.work,r.present,r.late,r.minutes,r.absent,r.leave]))+'<div class="note">বাংলাদেশ সময় অনুযায়ী আজ পর্যন্ত হিসাব। চলমান দিনের অনুপস্থিতি অফিস শেষ হওয়ার পরে গণনা হবে। ভবিষ্যতের দিন ও যোগদানের আগের দিন বাদ থাকবে।</div></div>'}

if(page===pages[5]){const s=settings();content='<div class="title"><h1>অফিসের নিয়ম</h1></div><div class="panel">'+form('settings',field('অফিস শুরু','start','time',s.start)+field('অফিস শেষ','end','time',s.end)+field('দেরি মাফ (মিনিট)','grace','number',s.grace)+'<label>সাপ্তাহিক বন্ধ<select name="off">'+['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'].map((d,i)=>'<option value="'+i+'" '+(Number(s.off)===i?'selected':'')+'>'+d+'</option>').join('')+'</select></label>')+'<div class="note">দেরি মাফের সীমা পার হলে অফিস শুরুর সময় থেকে মোট দেরি গণনা হবে। নিয়ম পরিবর্তন করলে পুরোনো রিপোর্টও বর্তমান নিয়ম অনুযায়ী গণনা হবে।</div></div>'}el('app').innerHTML=content;bind();if(page===pages[4])bindDevices();}

function deviceConnection(d){if(d.active===false)return tag('Inactive','warn');const st=list('deviceStatus').find(x=>x.device===d.id);const fresh=st&&Date.now()-Date.parse(st.updated)<30000;return fresh&&st.online?tag('Connected'):tag('Not Connected','bad')}
function devicePage(){const all=list('device'),rows=all.filter(d=>(d.name+' '+(d.shortName||'')+' '+(d.serial||'')+' '+(d.location||'')).toLowerCase().includes(deviceSearch.toLowerCase()));

const locations=[...new Set(all.map(d=>d.location||'Location দেওয়া হয়নি'))];
const locationView=locations.length?locations.map(location=>'<div class="location-group"><h2>'+esc(location)+'</h2>'+table(['Device','Model','Connection'],all.filter(d=>(d.location||'Location দেওয়া হয়নি')===location).map(d=>[esc(d.name),esc(d.model),deviceConnection(d)]))+'</div>').join(''):'<div class="empty">প্রথমে Device যোগ করুন</div>';
return '<div class="title"><h1>Attendance Devices</h1><button id="device-new">+ New</button></div><div class="panel device-list"><div class="device-controls"><div class="device-tabs"><button data-device-tab="list" class="'+(deviceTab==='list'?'selected':'')+'">List View</button><button data-device-tab="locations" class="'+(deviceTab==='locations'?'selected':'')+'">Locations</button></div><div class="toolbar"><input id="device-search" type="search" aria-label="Search devices" placeholder="Search device / serial" value="'+esc(deviceSearch)+'"><button id="device-refresh" class="secondary">Refresh</button></div></div>'+(deviceTab==='list'?listView:locationView)+'<div class="device-footer">Showing '+rows.length+' of '+all.length+' devices</div></div><div class="note">Device: IP ও Port দিয়ে local Connector সংযোগ। ADMS: Serial Number দিয়ে নিবন্ধন; ADMS Receiver সেটআপ এখনো বাকি। Connected অবস্থা সর্বশেষ ৩০ সেকেন্ডের ডিভাইস উত্তরের ভিত্তিতে দেখাবে।</div><div class="panel"><h2>User Info Push</h2>'+form('pushjob','<label>Employee<select name="employee" required>'+options()+'</select></label><label>Device<select name="device" required>'+all.filter(d=>d.active!==false&&d.accessType!=='ADMS').map(d=>'<option value="'+esc(d.id)+'">'+esc(d.name)+'</option>').join('')+'</select></label>','Push User Info')+table(['Employee','Device','Status','Details'],list('pushjob').map(j=>[esc(j.name),esc(all.find(d=>d.id===j.device)?.name||'—'),tag(j.status,j.status==='Failed'?'bad':j.status==='Queued'?'warn':''),esc(j.error||'—')]))+'</div><div class="panel"><h2>হাজিরার CSV আমদানি</h2><p class="muted">user_id,date,time · YYYY-MM-DD · HH:MM</p><div class="toolbar"><input id="csv" type="file" accept=".csv" aria-label="Attendance CSV"><button id="sample" class="secondary">নমুনা CSV</button></div><p id="importResult" aria-live="polite"></p></div><dialog id="device-dialog"><div class="dialog-head"><h2 id="device-form-title">New Device</h2><button type="button" id="device-close" class="secondary">Close</button></div><div id="device-form-body"></div></dialog>';
}
function deviceForm(d={}){const pick=(label,name,values,value)=>'<label>'+label+'<select name="'+name+'">'+values.map(v=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select></label>';return '<form data-kind="device" data-id="'+esc(d.id||'')+'" class="device-form">'+field('Device Name','name','text',d.name||'')+field('Short Name','shortName','text',d.shortName||'')+pick('Brand Name','brand',['ZKTeco'],'ZKTeco')+pick('Device Model','model',['ZKTeco K60','ZKTeco MB20','ZKTeco MB20-VL','Other'],d.model||'ZKTeco K60')+field('Serial Number','serial','text',d.serial||'',false)+pick('Access Type','accessType',['Device','ADMS'],d.accessType||'Device')+field('IP Address','address','text',d.address||'',false)+field('Port Number','port','number',d.port||4370,false)+field('Branch / Location','location','text',d.location||'')+'<label>Status<select name="active"><option value="true" '+(d.active!==false?'selected':'')+'>Active</option><option value="false" '+(d.active===false?'selected':'')+'>Inactive</option></select></label><div class="note" id="device-access-note"></div><button>Save Device</button></form>'}
function bindDevices(){el('device-new').onclick=()=>openDeviceDialog();el('device-close').onclick=()=>el('device-dialog').close();el('device-refresh').onclick=()=>load().catch(e=>toast(e.message));document.querySelectorAll('[data-device-tab]').forEach(b=>b.onclick=()=>{deviceTab=b.dataset.deviceTab;draw()});el('device-search').oninput=e=>{const at=e.target.selectionStart;deviceSearch=e.target.value;draw();el('device-search').focus();el('device-search').setSelectionRange(at,at)};document.querySelectorAll('[data-edit-device]').forEach(b=>b.onclick=()=>openDeviceDialog(records.find(d=>d.id===b.dataset.editDevice)));document.querySelectorAll('[data-toggle-device]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const d=records.find(x=>x.id===b.dataset.toggleDevice);await save('device',{...d,shortName:d.shortName||d.name,location:d.location||'Main Branch',accessType:d.accessType||'Device',active:d.active===false?'true':'false'},d.id);await load();toast('Device Status সংরক্ষিত')}catch(e){toast(e.message);b.disabled=false}})}
function openDeviceDialog(d){el('device-form-title').textContent=d?'Edit Device':'New Device';el('device-form-body').innerHTML=deviceForm(d);bind();const formNode=el('device-form-body').querySelector('form');const update=()=>{const adms=formNode.elements.accessType.value==='ADMS';formNode.elements.address.required=!adms;formNode.elements.port.required=!adms;formNode.elements.serial.required=adms;formNode.elements.address.disabled=adms;formNode.elements.port.disabled=adms;el('device-access-note').textContent=adms?'ADMS Receiver সংযোগ এখনো যুক্ত হয়নি। এখানে Serial দিয়ে Device নিবন্ধন হবে।':'স্থানীয় Connector-এর config-এ এই Device ID, IP ও Port মিলিয়ে দিন।'};formNode.elements.accessType.onchange=update;update();el('device-dialog').showModal()}

function reportRows(){if(!/^\d{4}-\d{2}$/.test(month))return [];const days=new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate();return employees().map(e=>{const r={name:e.name,work:0,present:0,late:0,minutes:0,absent:0,leave:0};for(let d=1;d<=days;d++){const date=month+'-'+String(d).padStart(2,'0');if(date>today()||date<e.join)continue;const x=row(e,date);if(new Date(date+'T12:00:00+06:00').getUTCDay()!==Number(settings().off))r.work++;if(x.status==='উপস্থিত')r.present++;if(x.status==='অনুপস্থিত')r.absent++;if(x.status==='ছুটি')r.leave++;if(x.late){r.late++;r.minutes+=x.late}}return r})}
function download(filename,content){const a=document.createElement('a');const url=URL.createObjectURL(new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}const csvCell=v=>'"'+String(v).replace(/"/g,'""').replace(/^[=+@-]/,"'")+'"';
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;draw()});if(el('date'))el('date').onchange=e=>{selectedDate=e.target.value||today();draw()};if(el('month'))el('month').onchange=e=>{month=e.target.value||today().slice(0,7);draw()};if(el('refresh'))el('refresh').onclick=()=>load().catch(e=>toast(e.message));document.querySelectorAll('form').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try{const data=Object.fromEntries(new FormData(f));if(f.dataset.kind==='leave')data.status='Pending';if(f.dataset.kind==='settings'){data.grace=Number(data.grace);data.off=Number(data.off)}if(f.dataset.kind==='punch'&&list('punch').some(p=>p.employee===data.employee&&p.date===data.date&&p.time===data.time))throw Error('এই হাজিরা ইতিমধ্যে আছে');await save(f.dataset.kind,data,f.dataset.id||undefined);await load();toast('সফলভাবে সংরক্ষিত হয়েছে')}catch(e){toast(e.message);b.disabled=false}});document.querySelectorAll('[data-leave]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const l=records.find(r=>r.id===b.dataset.leave);await save('leave',{...l,status:b.dataset.status},l.id);await load();toast('ছুটির অবস্থা সংরক্ষিত')}catch(e){toast(e.message);b.disabled=false}});if(el('export'))el('export').onclick=()=>download('attendance-'+month+'.csv',[['কর্মী','কর্মদিবস','উপস্থিত','দেরির দিন','দেরি মিনিট','অনুপস্থিত','ছুটি'],...reportRows().map(r=>[r.name,r.work,r.present,r.late,r.minutes,r.absent,r.leave])].map(r=>r.map(csvCell).join(',')).join('\n'));if(el('print'))el('print').onclick=()=>window.print();if(el('sample'))el('sample').onclick=()=>download('attendance-template.csv','user_id,date,time\n101,'+today()+',08:30\n101,'+today()+',21:00');if(el('csv'))el('csv').onchange=importCSV;}
async function importCSV(e){const file=e.target.files[0];if(!file)return;try{const lines=(await file.text()).replace(/^\ufeff/,'').trim().split(/\r?\n/);if(lines.length>2001)throw Error('একবারে সর্বোচ্চ ২০০০ হাজিরা আমদানি করুন');if(lines.shift().trim()!=='user_id,date,time')throw Error('CSV header হবে user_id,date,time');let added=0,skipped=0;const staged=[];for(const [i,line]of lines.entries()){const [code,date,time]=line.split(',').map(v=>v.trim().replace(/^"|"$/g,''));const employee=employees().find(e=>e.code===code);if(!employee)throw Error('লাইন '+(i+2)+': User ID '+code+' কর্মীর তালিকায় নেই');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time))throw Error('লাইন '+(i+2)+': তারিখ বা সময় সঠিক নয়');staged.push({employee:employee.id,date,time})}for(const p of staged){if(list('punch').some(r=>r.employee===p.employee&&r.date===p.date&&r.time===p.time)){skipped++;continue}const r=await save('punch',p);records.push({id:r.id,kind:'punch',...p});added++;if(el('importResult'))el('importResult').textContent=added+' হাজিরা সংরক্ষিত…'}await load();toast(added+' হাজিরা আমদানি হয়েছে; '+skipped+' ডুপ্লিকেট বাদ')}catch(err){await load(false).catch(()=>{});toast(err.message+'। আগের সফল হাজিরা সংরক্ষিত আছে; ফাইল সংশোধন করে আবার দিন।')}}
async function unusedInitialLoad(){await load().catch(e=>{el('app').innerHTML='<div class="panel error">'+esc(e.message)+' <button onclick="location.reload()">আবার চেষ্টা</button></div>'});}
if(document.modelContext?.registerTool){Promise.resolve(document.modelContext.registerTool({name:'view_attendance_report',description:'Open the monthly attendance report for a selected month',inputSchema:{type:'object',properties:{month:{type:'string',pattern:'^\\d{4}-\\d{2}$'}},required:['month'],additionalProperties:false},annotations:{readOnlyHint:true},execute:async input=>{if(!input||!/^\d{4}-(0[1-9]|1[0-2])$/.test(input.month))throw Error('Invalid month');await load(false);month=input.month;page=pages[3];draw();return {month,employees:reportRows()}}})).catch(()=>{});}


let identity=null;
function loginScreen(){el('nav').innerHTML='';el('app').innerHTML='<div class="panel"><h2>DMS Attendance</h2><p>মূল DMS-এ Admin বা DM দিয়ে লগইন করে Attendance মেনু খুলুন।</p><p id="sessionMessage" class="error"></p></div>'}
onAuthStateChanged(auth,user=>{if(unsubscribe)unsubscribe();if(!user){records=[];loginScreen();return}unsubscribe=onValue(ref(db,'attendance/records'),snap=>{records=Object.entries(snap.val()||{}).map(([id,v])=>({id,...v}));if(!document.querySelector('form :focus')&&!el('device-dialog')?.open)draw();else toast('নতুন তথ্য এসেছে; ফর্ম শেষ হলে রিফ্রেশ করুন')},err=>{el('app').innerHTML='<div class="panel error">Attendance ডেটা পাওয়া যাচ্ছে না। Firebase rules ও অনুমতি পরীক্ষা করুন।</div>'});});
window.addEventListener('message',async event=>{if(event.origin!==location.origin||event.source!==window.parent)return;const msg=event.data||{};if(msg.type==='DMS_ATTENDANCE_TOKEN'){try{identity=msg.identity;await signInWithCustomToken(auth,msg.token)}catch(e){loginScreen();el('sessionMessage').textContent='Attendance লগইন যাচাই হয়নি। সার্ভার সেটআপ পরীক্ষা করুন।'}}if(msg.type==='DMS_ATTENDANCE_CLOSED'){if(unsubscribe)unsubscribe();await signOut(auth)}if(msg.type==='DMS_ATTENDANCE_ERROR'){loginScreen();el('sessionMessage').textContent=String(msg.message||'সংযোগ হয়নি')}});
const back=document.createElement('button');back.textContent='DMS-এ ফিরুন';back.className='secondary';back.onclick=()=>window.parent.postMessage({type:'DMS_ATTENDANCE_CLOSE'},location.origin);document.querySelector('header').append(back);
if(window.parent!==window)window.parent.postMessage({type:'DMS_ATTENDANCE_READY'},location.origin);else loginScreen();

</script></body></html>

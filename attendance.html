const tag=(text,type='')=>'<span class="tag '+type+'">'+esc(text)+'</span>';function table(headers,rows){return rows.length?'<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<div class="empty">এখনো কোনো তথ্য নেই</div>'}function attendanceTable(rows){return table(['কর্মী / User ID','প্রথম হাজিরা','শেষ হাজিরা','অবস্থা','দেরি'],rows.map(r=>['<strong>'+esc(r.name)+'</strong><br><small>'+esc(r.code)+'</small>',r.first,r.last,tag(r.status,r.status==='অনুপস্থিত'?'bad':r.status==='অপেক্ষায়'?'warn':''),r.late?tag(r.late+' মিনিট','warn'):'—']))}const field=(label,name,type='text',value='',required=true)=>'<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(required?'required':'')+'></label>';const form=(kind,contents,label='সংরক্ষণ')=>'<form data-kind="'+kind+'">'+contents+'<button>'+label+'</button></form>';
function draw(){el('clock').textContent=today()+' · বাংলাদেশ সময়';el('nav').innerHTML=pages.map(p=>'<button class="'+(page===p?'active':'')+'" data-page="'+p+'">'+p+'</button>').join('');let content='';if(page===pages[0]){const rows=employees().map(e=>row(e,selectedDate));const cards=[['মোট কর্মী',rows.length],['উপস্থিত',rows.filter(r=>r.status==='উপস্থিত').length],['দেরি',rows.filter(r=>r.late).length],['অনুপস্থিত',rows.filter(r=>r.status==='অনুপস্থিত').length]];content='<div class="title"><h1>আজকের হাজিরা</h1><div class="toolbar"><input aria-label="হাজিরার তারিখ" id="date" type="date" value="'+selectedDate+'"><button class="secondary" id="refresh">রিফ্রেশ</button></div></div><div class="cards">'+cards.map(c=>'<div class="card"><span class="muted">'+c[0]+'</span><b>'+c[1]+'</b></div>').join('')+'</div><div class="panel"><h2>হাজিরার তালিকা</h2>'+attendanceTable(rows)+'</div><div class="panel"><h2>হাজিরা যোগ করুন</h2>'+form('punch','<label>কর্মী<select name="employee" required>'+options()+'</select></label>'+field('তারিখ','date','date',selectedDate)+field('সময়','time','time',nowTime()),'হাজিরা সংরক্ষণ')+'<div class="note">৮:৩৫ পর্যন্ত দেরি মাফ। দিনের শেষ সময়ের আগে হাজিরা না থাকলে “অপেক্ষায়” দেখাবে। একাধিক হাজিরার প্রথম ও শেষ সময় রিপোর্টে দেখাবে।</div></div>'}
if(page===pages[1])content='<div class="title"><h1>কর্মী</h1>'+tag(employees().length+' জন')+'</div><div class="panel"><h2>নতুন কর্মী</h2>'+form('employee',field('Employee ID','employeeId')+field('Employee Name','name')+field('Employee Number','employeeNumber','tel')+field('Personal Number','personalNumber','tel')+field('Joining Date','join','date',today())+field('Branch','branch')+field('Device User ID','code'))+'</div><div class="panel">'+table(['Employee ID','Name','Employee Number','Personal Number','Joining Date','Branch','Device ID'],employees().map(e=>[esc(e.employeeId),esc(e.name),esc(e.employeeNumber),esc(e.personalNumber),e.join,esc(e.branch),esc(e.code)]))+'</div>';

if(page===pages[4])content='<div class="title"><h1>Attendance ডিভাইস</h1>'+tag('Connector সংযোগ প্রয়োজন','warn')+'</div><div class="panel"><h2>ZKTeco ডিভাইস যোগ করুন</h2>'+form('device',field('ডিভাইসের নাম','name')+'<label>মডেল<select name="model"><option>ZKTeco K60</option><option>ZKTeco MB20</option></select></label>'+field('ডিভাইস IP','address')+field('TCP Port','port','number',4370))+'</div><div class="panel">'+table(['ডিভাইস / ID','মডেল','IP','সংযোগ'],list('device').map(d=>{const st=list('deviceStatus').find(x=>x.device===d.id);const fresh=st&&Date.now()-Date.parse(st.updated)<30000;return [esc(d.name)+'<br><small>'+esc(d.id)+'</small>',esc(d.model),esc(d.address),tag(fresh&&st.online?'সংযুক্ত':'অফলাইন',fresh&&st.online?'':'warn')]}))+'<div class="note">অফিসের Connector চালু থাকলে ডিভাইসের নতুন হাজিরা Firebase-এ যাবে। Live Capture সমর্থিত হলে সঙ্গে সঙ্গে, অন্য ক্ষেত্রে প্রায় ২ সেকেন্ড পরপর সংগ্রহের চেষ্টা হবে।</div></div><div class="panel"><h2>হাজিরার CSV আমদানি</h2><p class="muted">কলাম: user_id,date,time · তারিখ: YYYY-MM-DD · সময়: HH:MM</p><div class="toolbar"><input id="csv" type="file" accept=".csv" aria-label="হাজিরার CSV"><button id="sample" class="secondary">নমুনা CSV</button></div><p id="importResult" aria-live="polite"></p></div>';

if(page===pages[5]){const s=settings();content='<div class="title"><h1>অফিসের নিয়ম</h1></div><div class="panel">'+form('settings',field('অফিস শুরু','start','time',s.start)+field('অফিস শেষ','end','time',s.end)+field('দেরি মাফ (মিনিট)','grace','number',s.grace)+'<label>সাপ্তাহিক বন্ধ<select name="off">'+['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'].map((d,i)=>'<option value="'+i+'" '+(Number(s.off)===i?'selected':'')+'>'+d+'</option>').join('')+'</select></label>')+'<div class="note">দেরি মাফের সীমা পার হলে অফিস শুরুর সময় থেকে মোট দেরি গণনা হবে। নিয়ম পরিবর্তন করলে পুরোনো রিপোর্টও বর্তমান নিয়ম অনুযায়ী গণনা হবে।</div></div>'}el('app').innerHTML=content;bind();}
function reportRows(){if(!/^\d{4}-\d{2}$/.test(month))return [];const days=new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate();return employees().map(e=>{const r={name:e.name,work:0,present:0,late:0,minutes:0,absent:0,leave:0};for(let d=1;d<=days;d++){const date=month+'-'+String(d).padStart(2,'0');if(date>today()||date<e.join)continue;const x=row(e,date);if(new Date(date+'T12:00:00+06:00').getUTCDay()!==Number(settings().off))r.work++;if(x.status==='উপস্থিত')r.present++;if(x.status==='অনুপস্থিত')r.absent++;if(x.status==='ছুটি')r.leave++;if(x.late){r.late++;r.minutes+=x.late}}return r})}
function download(filename,content){const a=document.createElement('a');const url=URL.createObjectURL(new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}const csvCell=v=>'"'+String(v).replace(/"/g,'""').replace(/^[=+@-]/,"'")+'"';
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;draw()});if(el('date'))el('date').onchange=e=>{selectedDate=e.target.value||today();draw()};if(el('month'))el('month').onchange=e=>{month=e.target.value||today().slice(0,7);draw()};if(el('refresh'))el('refresh').onclick=()=>load().catch(e=>toast(e.message));document.querySelectorAll('form').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try{const data=Object.fromEntries(new FormData(f));if(f.dataset.kind==='leave')data.status='Pending';if(f.dataset.kind==='settings'){data.grace=Number(data.grace);data.off=Number(data.off)}if(f.dataset.kind==='punch'&&list('punch').some(p=>p.employee===data.employee&&p.date===data.date&&p.time===data.time))throw Error('এই হাজিরা ইতিমধ্যে আছে');await save(f.dataset.kind,data);await load();toast('সফলভাবে সংরক্ষিত হয়েছে')}catch(e){toast(e.message);b.disabled=false}});document.querySelectorAll('[data-leave]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const l=records.find(r=>r.id===b.dataset.leave);await save('leave',{...l,status:b.dataset.status},l.id);await load();toast('ছুটির অবস্থা সংরক্ষিত')}catch(e){toast(e.message);b.disabled=false}});if(el('export'))el('export').onclick=()=>download('attendance-'+month+'.csv',[['কর্মী','কর্মদিবস','উপস্থিত','দেরির দিন','দেরি মিনিট','অনুপস্থিত','ছুটি'],...reportRows().map(r=>[r.name,r.work,r.present,r.late,r.minutes,r.absent,r.leave])].map(r=>r.map(csvCell).join(',')).join('\n'));if(el('print'))el('print').onclick=()=>window.print();if(el('sample'))el('sample').onclick=()=>download('attendance-template.csv','user_id,date,time\n101,'+today()+',08:30\n101,'+today()+',21:00');if(el('csv'))el('csv').onchange=importCSV;}
async function importCSV(e){const file=e.target.files[0];if(!file)return;try{const lines=(await file.text()).replace(/^\ufeff/,'').trim().split(/\r?\n/);if(lines.length>2001)throw Error('একবারে সর্বোচ্চ ২০০০ হাজিরা আমদানি করুন');if(lines.shift().trim()!=='user_id,date,time')throw Error('CSV header হবে user_id,date,time');let added=0,skipped=0;const staged=[];for(const [i,line]of lines.entries()){const [code,date,time]=line.split(',').map(v=>v.trim().replace(/^"|"$/g,''));const employee=employees().find(e=>e.code===code);if(!employee)throw Error('লাইন '+(i+2)+': User ID '+code+' কর্মীর তালিকায় নেই');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time))throw Error('লাইন '+(i+2)+': তারিখ বা সময় সঠিক নয়');staged.push({employee:employee.id,date,time})}for(const p of staged){if(list('punch').some(r=>r.employee===p.employee&&r.date===p.date&&r.time===p.time)){skipped++;continue}const r=await save('punch',p);records.push({id:r.id,kind:'punch',...p});added++;if(el('importResult'))el('importResult').textContent=added+' হাজিরা সংরক্ষিত…'}await load();toast(added+' হাজিরা আমদানি হয়েছে; '+skipped+' ডুপ্লিকেট বাদ')}catch(err){await load(false).catch(()=>{});toast(err.message+'। আগের সফল হাজিরা সংরক্ষিত আছে; ফাইল সংশোধন করে আবার দিন।')}}
async function unusedInitialLoad(){await load().catch(e=>{el('app').innerHTML='<div class="panel error">'+esc(e.message)+' <button onclick="location.reload()">আবার চেষ্টা</button></div>'});}
if(document.modelContext?.registerTool){Promise.resolve(document.modelContext.registerTool({name:'view_attendance_report',description:'Open the monthly attendance report for a selected month',inputSchema:{type:'object',properties:{month:{type:'string',pattern:'^\\d{4}-\\d{2}$'}},required:['month'],additionalProperties:false},annotations:{readOnlyHint:true},execute:async input=>{if(!input||!/^\d{4}-(0[1-9]|1[0-2])$/.test(input.month))throw Error('Invalid month');await load(false);month=input.month;page=pages[3];draw();return {month,employees:reportRows()}}})).catch(()=>{});}


let identity=null;
function loginScreen(){el('nav').innerHTML='';el('app').innerHTML='<div class="panel"><h2>DMS Attendance</h2><p>মূল DMS-এ Admin বা DM দিয়ে লগইন করে Attendance মেনু খুলুন।</p><p id="sessionMessage" class="error"></p></div>'}
onAuthStateChanged(auth,user=>{if(unsubscribe)unsubscribe();if(!user){records=[];loginScreen();return}unsubscribe=onValue(ref(db,'attendance/records'),snap=>{records=Object.entries(snap.val()||{}).map(([id,v])=>({id,...v}));if(!document.querySelector('form :focus'))draw();else toast('নতুন তথ্য এসেছে; ফর্ম শেষ হলে রিফ্রেশ করুন')},err=>{el('app').innerHTML='<div class="panel error">Attendance ডেটা পাওয়া যাচ্ছে না। Firebase rules ও অনুমতি পরীক্ষা করুন।</div>'});});
window.addEventListener('message',async event=>{if(event.origin!==location.origin||event.source!==window.parent)return;const msg=event.data||{};if(msg.type==='DMS_ATTENDANCE_TOKEN'){try{identity=msg.identity;await signInWithCustomToken(auth,msg.token)}catch(e){loginScreen();el('sessionMessage').textContent='Attendance লগইন যাচাই হয়নি। সার্ভার সেটআপ পরীক্ষা করুন।'}}if(msg.type==='DMS_ATTENDANCE_CLOSED'){if(unsubscribe)unsubscribe();await signOut(auth)}if(msg.type==='DMS_ATTENDANCE_ERROR'){loginScreen();el('sessionMessage').textContent=String(msg.message||'সংযোগ হয়নি')}});
const back=document.createElement('button');back.textContent='DMS-এ ফিরুন';back.className='secondary';back.onclick=()=>window.parent.postMessage({type:'DMS_ATTENDANCE_CLOSE'},location.origin);document.querySelector('header').append(back);
if(window.parent!==window)window.parent.postMessage({type:'DMS_ATTENDANCE_READY'},location.origin);else loginScreen();

</script></body></html>

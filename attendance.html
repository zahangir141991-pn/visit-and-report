<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b4c"><meta name="attendance-version" content="2026-10-26-dm-v128"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Workforce · DMS Attendance</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23142b4c'/%3E%3Cpath d='m8 16 5 5 11-12' fill='none' stroke='%2377d4bd' stroke-width='4'/%3E%3C/svg%3E"><link rel="stylesheet" href="attendance/styles.css?v=124"></head>
<body><aside class="sidebar"><a class="brand" href="#dashboard" data-nav="dashboard" aria-label="Workforce home"><span class="brand-symbol">W<span></span></span><span>Workforce<small>M/S. MOSTAFA</small></span></a><div class="nav-caption">WORKSPACE</div><nav id="navigation" aria-label="Attendance navigation"></nav><div class="sidebar-bottom"><div class="workspace-badge"><span class="workspace-avatar">M</span><span>M/S. Mostafa<small>DMS Attendance</small></span></div><button class="back-button" id="back-dms" type="button">← Back to DMS</button></div></aside>
<div class="workspace"><header class="topbar"><div><span class="breadcrumb">Workspace <span>/</span> <strong id="breadcrumb">Attendance</strong></span></div><div class="topbar-tools"><span id="connection" class="connection"><i></i>Connecting</span><time id="clock"></time><span class="admin-avatar" id="admin-avatar">A</span></div></header><main id="app"><section class="boot-card"><div class="boot-icon">W</div><span class="eyebrow">DMS WORKFORCE</span><h1>Opening your workspace</h1><p id="boot-message">Establishing a secure connection…</p><div class="loading-line"></div></section></main><footer>Copyright © 2026 Zahangir Kabir. All rights reserved.</footer></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><div><span class="eyebrow" id="dialog-eyebrow">WORKSPACE</span><h2 id="dialog-title"></h2></div><button class="icon-button" id="dialog-close" type="button" aria-label="Close dialog">×</button></div><div id="dialog-body"></div><p id="dialog-error" class="form-error" role="alert"></p></dialog><div id="toasts" aria-live="polite"></div><section id="print-area"></section>
<script>
(()=>{let timer,stage='scripts';const text={scripts:'Loading secure services…',auth:'Preparing your DMS session…',waiting:'Verifying access with DMS…',signin:'Signing in to Attendance…',data:'Receiving the latest records…'};const boot={phase(value){stage=value;clearTimeout(timer);const n=document.getElementById('boot-message');if(n)n.textContent=text[value]||'';if(!['ready','error','closed'].includes(value))timer=setTimeout(()=>boot.fail(value==='scripts'?'Secure services could not be loaded. Check your Internet connection and try again.':'The connection did not complete in time. Check your DMS session and try again.'),value==='waiting'?20000:15000)},fail(message){boot.phase('error');const box=document.createElement('section');box.className='boot-card';const title=document.createElement('h1');title.textContent='Unable to connect';const description=document.createElement('p');description.textContent=message;const button=document.createElement('button');button.type='button';button.textContent='Try again';button.onclick=()=>location.reload();box.append(title,description,button);document.getElementById('app').replaceChildren(box)}};window.attendanceBoot=boot;window.addEventListener('error',()=>{if(!['ready','closed','error'].includes(stage))boot.fail('Attendance could not start. Check your connection and try again.')});window.addEventListener('unhandledrejection',()=>{if(!['ready','closed','error'].includes(stage))boot.fail('The secure connection was interrupted. Please try again.')});document.getElementById('back-dms').onclick=()=>window.parent.postMessage({type:'DMS_ATTENDANCE_CLOSE'},location.origin);boot.phase('scripts');})();
</script><script type="module">import('./attendance/app.mjs?v=128').catch(()=>window.attendanceBoot.fail('Attendance services could not be loaded. Check your Internet connection and try again.'));</script></body></html>

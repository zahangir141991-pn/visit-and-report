function openDeviceDialog(d){el('device-form-title').textContent=d?'Edit ZKTeco Device':'Add ZKTeco Device';el('device-form-body').innerHTML=deviceForm(d);bind();const f=el('device-form-body').querySelector('form');const update=()=>{const adms=f.elements.accessType.value==='ADMS';f.elements.address.required=!adms;f.elements.port.required=!adms;f.elements.serial.required=adms;f.elements.publicIp.required=adms&&!d?.id;for(const key of ['publicIp','serverHost','transport','serverPort']){f.elements[key].closest('label').hidden=!adms;f.elements[key].disabled=!adms}for(const key of ['address','port']){f.elements[key].closest('label').hidden=adms;f.elements[key].disabled=adms}f.elements.serverPort.required=adms;f.elements.serverPort.min=1;f.elements.serverPort.max=65535;f.elements.port.min=1;f.elements.port.max=65535;el('device-access-note').textContent=adms?'ADMS: machine নিজে Internet দিয়ে server-এ যোগাযোগ করবে। Public IP হলো branch Internet-এর IP; Device Local IP নয়। Receiver আগে চালু থাকতে হবে।':'Device / TCP/IP: এই machine-এর কাছে চালু local Connector computer প্রয়োজন। শুধু IP দিয়ে browser থেকে সরাসরি সংযোগ হবে না।'};f.oninput=()=>{for(const key of ['serial','publicIp','serverHost'])f.elements[key].setCustomValidity('')};f.elements.accessType.onchange=update;f.elements.transport.onchange=()=>{if(['80','443',''].includes(f.elements.serverPort.value))f.elements.serverPort.value=f.elements.transport.value==='HTTP'?'80':'443'};el('device-prev').onclick=()=>showDeviceStage(deviceWizardStep-1);el('device-next').onclick=()=>{if(validateDeviceStage(f))showDeviceStage(deviceWizardStep+1)};update();showDeviceStage(0);el('device-dialog').showModal()}

function reportRows(){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))return [];const days=new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate();return employees().map(e=>{const r={name:e.name,work:0,present:0,late:0,minutes:0,absent:0,leave:0};for(let d=1;d<=days;d++){const date=month+'-'+String(d).padStart(2,'0');if(date>today()||date<e.join)continue;const x=row(e,date);if(new Date(date+'T12:00:00+06:00').getUTCDay()!==Number(settings().off))r.work++;if(x.status==='উপস্থিত')r.present++;if(x.status==='অনুপস্থিত')r.absent++;if(x.status==='ছুটি')r.leave++;if(x.late){r.late++;r.minutes+=x.late}}return r})}

function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;draw()});if(el('date'))el('date').onchange=e=>{selectedDate=e.target.value||today();draw()};if(el('month'))el('month').onchange=e=>{month=e.target.value||today().slice(0,7);draw()};if(el('refresh'))el('refresh').onclick=()=>load().catch(e=>toast(e.message));document.querySelectorAll('form').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('[type=submit]')||f.querySelector('button');if(f.dataset.kind==='device'&&!validateDeviceStage(f,true))return;if(busy)return;busy=true;b.disabled=true;const originalLabel=b.textContent;b.textContent='সংরক্ষণ হচ্ছে…';try{if(navigator.onLine===false)throw Error('Internet নেই। সংযোগ ফিরলে সংরক্ষণ করুন।');const data=Object.fromEntries(new FormData(f));if(f.dataset.kind==='leave')data.status='Pending';if(f.dataset.kind==='settings'){data.grace=Number(data.grace);data.off=Number(data.off)}if(f.dataset.kind==='punch'&&list('punch').some(p=>p.employee===data.employee&&p.date===data.date&&p.time===data.time))throw Error('এই হাজিরা ইতিমধ্যে আছে');const saved=await save(f.dataset.kind,data,f.dataset.id||undefined);if(!records.some(r=>r.id===saved.id))records.push({...data,id:saved.id,kind:f.dataset.kind});else records=records.map(r=>r.id===saved.id?{...r,...data,kind:f.dataset.kind}:r);busy=false;draw();toast('সফলভাবে সংরক্ষিত হয়েছে')}catch(e){toast(e.message)}finally{busy=false;b.disabled=false;b.textContent=originalLabel}});document.querySelectorAll('[data-leave]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const l=records.find(r=>r.id===b.dataset.leave);await save('leave',{...l,status:b.dataset.status},l.id);await load();toast('ছুটির অবস্থা সংরক্ষিত')}catch(e){toast(e.message);b.disabled=false}});if(el('export'))el('export').onclick=()=>download('attendance-'+month+'.csv',[['কর্মী','কর্মদিবস','উপস্থিত','দেরির দিন','দেরি মিনিট','অনুপস্থিত','ছুটি'],...reportRows().map(r=>[r.name,r.work,r.present,r.late,r.mi async function importCSV(e){const file=e.target.files[0];if(!file||busy)return;busy=true;try{const lines=(await file.text()).replace(/^\ufeff/,'').trim().split(/\r?\n/);if(lines.length>2001)throw Error('একবারে সর্বোচ্চ ২০০০ হাজিরা আমদানি করুন');if(lines.shift().trim()!=='user_id,date,time')throw Error('CSV header হবে user_id,date,time');let added=0,skipped=0;const staged=[];for(const [i,line]of lines.entries()){const [code,date,time]=line.split(',').map(v=>v.trim().replace(/^"|"$/g,''));const employee=employees().find(e=>e.code===code);if(!employee)throw Error('লাইন '+(i+2)+': User ID '+code+' কর্মীর তালিকায় নেই');if(!validDate(date)||!validTime(time))throw Error('লাইন '+(i+2)+': তারিখ বা সময় সঠিক নয়');staged.push({employee:employee.id,date,time})}for(const p of staged){if(list('punch').some(r=>r.employee===p.employee&&r.date===p.date&&r.time===p.time)){skipped++;continue}const r=await save('punch',p);records.push({id:r.id,kind:'punch',...p});added++;if(el('importResult'))el('importResult').textContent=added+' হাজিরা সংরক্ষিত…'}await load();toast(added+' হাজিরা আমদানি হয়েছে; '+skipped+' ডুপ্লিকেট বাদ')}catch(err){await load(false).catch(()=>{});toast(err.message+'। আগের সফল হাজিরা সংরক্ষিত আছে; ফাইল সংশোধন করে আবার দিন।')}finally{busy=false;e.target.value='';if(pendingAttendanceRender&&auth.currentUser){pendingAttendanceRender=false;draw();}}}

function loginScreen(){phase(window.parent===window?'error':'waiting');el('nav').innerHTML='';el('app').innerHTML='<div class="panel boot-card"><span class="eyebrow">SECURE WORKSPACE</span><h2>DMS Attendance</h2><p class="muted">মূল DMS-এ Admin বা DM দিয়ে লগইন করে Attendance মেনু খুলুন।</p><p id="sessionMessage" class="error"></p><button id="attendance-retry" type="button">আবার চেষ্টা করুন</button></div>';el('attendance-retry').onclick=()=>location.reload()}
let dataLoadTimer;
onAuthStateChanged(auth,user=>{if(attendanceClosed){if(user)signOut(auth).catch(()=>{});return}if(unsubscribe)unsubscribe();clearTimeout(dataLoadTimer);if(!user){records=[];loginScreen();return}phase('data');dataLoadTimer=setTimeout(()=>window.attendanceFailure('Firebase থেকে Attendance তথ্য আসেনি। Internet ও database permission পরীক্ষা করে আবার চেষ্টা করুন।'),12000);unsubscribe=onValue(ref(db,'attendance/records'),snap=>{if(attendanceClosed||auth.currentUser?.uid!==user.uid)return;clearTimeout(dataLoadTimer);try{records=Object.entries(snap.val()||{}).filter(([,v])=>v&&typeof v==='object').map(([id,v])=>({...v,id}));refreshDeviceConnections();if(!busy&&!document.querySelector('form :focus')&&!el('device-dialog')?.open&&!el('employee-dialog')?.open){pendingAttendanceRender=false;draw();}else pendingAttendanceRender=true;phase('ready');}catch{window.attendanceFailure('Attendance তথ্য দেখানো যায়নি। আবার চেষ্টা করুন।')}},()=>{clearTimeout(dataLoadTimer);window.attendanceFailure('Attendance ডেটার অনুমতি পাওয়া যায়নি। Firebase rules ও login permission পরীক্ষা করুন।')});});
window.addEventListener('message',async event=>{
 if(event.origin!==location.origin||event.source!==window.parent)return;
 const msg=event.data||{};
 if(msg.type==='DMS_ATTENDANCE_TOKEN'){
  if(attendanceClosed||typeof msg.token!=='string'||!msg.token||!['Admin','DM'].includes(msg.identity?.role))return;
  const generation=++attendanceSessionGeneration;
  try{phase('signin');await timeout(signInWithCustomToken(auth,msg.token),12000,'Attendance লগইন সময়মতো হয়নি।');if(attendanceClosed||generation!==attendanceSessionGeneration){await signOut(auth);return;}identity=msg.identity;}
  catch(e){if(!attendanceClosed&&generation===attendanceSessionGeneration){loginScreen();phase('error');el('sessionMessage').textContent='Attendance লগইন যাচাই হয়নি। সার্ভার সেটআপ পরীক্ষা করুন।';}}
 }
 if(msg.type==='DMS_ATTENDANCE_CLOSED'){attendanceClosed=true;phase('closed');clearTimeout(dataLoadTimer);attendanceSessionGeneration++;identity=null;records=[];if(unsubscribe){unsubscribe();unsubscribe=null;}await signOut(auth);}
 if(msg.type==='DMS_ATTENDANCE_ERROR'&&!attendanceClosed){loginScreen();phase('error');el('sessionMessage').textContent=String(msg.message||'সংযোগ হয়নি');}
});
const back=document.createElement('button');back.textContent='DMS-এ ফিরুন';back.className='secondary';back.onclick=()=>window.parent.postMessage({type:'DMS_ATTENDANCE_CLOSE'},location.origin);document.querySelector('header').append(back);
phase('waiting');if(window.parent!==window)window.parent.postMessage({type:'DMS_ATTENDANCE_READY'},location.origin);else loginScreen();

}
startAttendance().catch(()=>window.attendanceFailure('Attendance-এর নিরাপদ সংযোগ শুরু হয়নি। Internet সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।'));
</script></body></html>
